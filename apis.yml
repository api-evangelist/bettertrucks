aid: bettertrucks

name: Bettertrucks

description: Better Trucks is a regional, last‑mile delivery platform that provides rapid residential parcel delivery for shippers, carriers,
  freight operators and drivers. The company leverages technology to minimize stops, improve efficiency, and offer same‑day, next‑day, two‑day,
  and two‑hour delivery options. Founded in 2019, Better Trucks serves retailers seeking to meet rising consumer expectations for fast, reliable
  shipping across the United States.

